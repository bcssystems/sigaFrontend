<div class="page-content" id="reporteFinanciero">
  <div class="page-header">
    <div><h4><i class="fas fa-file-invoice-dollar me-2" style="color:var(--primary)"></i>Reportes financieros</h4><small class="text-muted">Consulta y exporta los movimientos financieros filtrados</small></div>
    <div class="d-flex gap-2"><button class="btn btn-primary btn-sm" id="btnPdfReporte"><i class="fas fa-file-pdf me-1"></i>PDF</button><button class="btn btn-outline-success btn-sm" id="btnCsvReporte"><i class="fas fa-file-csv me-1"></i>CSV</button></div>
  </div>
  <div class="panel-card p-3 mb-3"><div class="d-flex justify-content-between align-items-center mb-3"><div><h6 class="fw-bold mb-1"><i class="fas fa-filter me-2"></i>Parámetros del reporte</h6><small class="text-muted">El reporte se actualiza al cambiar un filtro</small></div><button class="btn btn-outline-secondary btn-sm" id="btnLimpiarReporte"><i class="fas fa-eraser me-1"></i>Limpiar</button></div><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label small">Desde</label><input type="date" class="form-control form-control-sm" id="repDesde"></div><div class="col-md-3"><label class="form-label small">Hasta</label><input type="date" class="form-control form-control-sm" id="repHasta"></div><div class="col-md-2"><label class="form-label small">Cuenta</label><select class="form-select form-select-sm" id="repCuenta"><option value="">Todas</option></select></div><div class="col-md-2"><label class="form-label small">Tipo</label><select class="form-select form-select-sm" id="repTipo"><option value="">Todos</option><option>INGRESO</option><option>EGRESO</option></select></div><div class="col-md-2"><label class="form-label small">Categoría</label><select class="form-select form-select-sm" id="repCategoria"><option value="">Todas</option><option>VENTA</option><option>ABONO</option><option>COMPRA</option><option>GASTO</option><option>CANCELACION</option></select></div></div></div>
  <div class="panel-card p-3 mb-3"><h6 class="fw-bold mb-3"><i class="fas fa-calculator me-2"></i>Totales del reporte</h6><div class="table-responsive"><table class="table table-custom table-sm mb-0"><tbody id="repTotalesBody"><tr><td colspan="4">Cargando...</td></tr></tbody></table></div></div>
  <div class="panel-card overflow-hidden"><div class="panel-card-header p-3"><h6 class="mb-0 fw-bold"><i class="fas fa-list me-2"></i>Movimientos incluidos en el reporte</h6></div><div class="table-responsive"><table class="table table-custom mb-0"><thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Cuenta</th><th>Tipo</th><th class="text-end">Monto</th></tr></thead><tbody id="repMovimientosBody"><tr><td colspan="6">Cargando...</td></tr></tbody></table></div></div>
</div>
